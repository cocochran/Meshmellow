[package]
name = "meshthing-ios-iroh-probe"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
iroh = "1.4"
llm-cluster = { git = "https://github.com/yash-joshi-0/HackOHIO26", rev = "bc50aec0a379ede8e44d5226d0e45a5098741df2" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }
