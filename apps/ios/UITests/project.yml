name: EnrollmentValidation
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  Meshmellow:
    type: application
    platform: iOS
    sources:
      - ../Sources
      - ../Shared
      - ../Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.meshmellow.mobile
        INFOPLIST_FILE: ../../Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ../../Sources/EnrollmentBridge.h
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ['-liconv', '-lresolv']
        LIBRARY_SEARCH_PATHS: '$(SRCROOT)/../../../enrollment/target/aarch64-apple-ios-sim/debug'
    dependencies:
      - framework: ../../../enrollment/target/aarch64-apple-ios-sim/debug/libmeshmellow_enrollment.a
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
  EnrollmentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: .
        excludes: [project.yml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.meshmellow.enrollment-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Meshmellow
schemes:
  EnrollmentValidation:
    build:
      targets:
        Meshmellow: all
        EnrollmentUITests: [test]
    test:
      targets: [EnrollmentUITests]
