[package]
name = "meshthing-enrollment"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "meshthing-enrollment"
path = "src/bin/enrollment.rs"
required-features = ["cli"]

[[bin]]
name = "layercake-rendezvous"
path = "src/bin/rendezvous.rs"
required-features = ["cli"]

[features]
cli = []

[dependencies]
anyhow = "1"
llm-cluster = { path = "../.." }
iroh = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[patch.crates-io]
netdev = { path = "../../experiments/mobile-probe/iroh-core/vendor/netdev" }
netwatch = { path = "../../experiments/mobile-probe/iroh-core/vendor/netwatch" }
