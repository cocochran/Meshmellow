name: Build executables

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'apps/web/**'
      - 'apps/desktop/**'
      - '.github/workflows/build-executables.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'apps/web/**'
      - 'apps/desktop/**'
      - '.github/workflows/build-executables.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executables-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: executable-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and test browser dashboard
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run check
          npm --prefix apps/web test
          npm --prefix apps/web run build
          npm --prefix apps/web run test:integration
      - name: Build release executable
        run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: Smoke test executable
        run: cargo run --release --locked --bin llm-cluster --target ${{ matrix.target }} -- --help
      - name: Smoke test browser launcher
        run: cargo run --release --locked --bin meshthing --target ${{ matrix.target }} -- --help
      - name: Package executable and checksums
        run: python apps/desktop/scripts/package-executable.py --target ${{ matrix.target }} --revision ${{ github.sha }}
      - name: Test extracted terminal launcher
        run: python apps/desktop/scripts/smoke-packaged-ui.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: meshthing-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
